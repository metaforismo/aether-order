name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: enumerate + test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22', '24']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Exhaustive enumeration (the proof)
        run: npm run enumerate

      # The service and the client are TypeScript against the packaged engine.
      # A type error here is an integration that would fail at runtime, so it is
      # a build failure rather than something a reviewer is asked to notice.
      - name: Typecheck (service + client)
        run: npm run typecheck

      - name: Build the client
        run: npm run build

      # Includes tests/playthrough.test.ts, which drives a full round through
      # the real HTTP service and asserts the exact credits at every step.
      - name: Tests
        run: npm test

      # Not informational. tools/bench.mjs exits non-zero when a published band
      # in docs/ENGINE.md §4 is breached. Round 2 ran this step and asserted
      # nothing, which is how the one figure offered as falsifiable became the
      # one figure that did not reproduce.
      - name: Reference timings, against the published bands (docs/ENGINE.md §4)
        run: npm run bench

  crosscheck:
    name: monte carlo cross-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Monte Carlo sanity pass
        run: npm run enumerate:montecarlo

  fixtures:
    name: fixtures are current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerate published paytable and frozen vectors
        run: npm run enumerate:write
      - name: Fail if anything drifted
        run: |
          if ! git diff --exit-code -- docs/paytable.json tests/fixtures; then
            echo "::error::docs/paytable.json or tests/fixtures is stale. Run 'npm run enumerate:write' and commit."
            exit 1
          fi
